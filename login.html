<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log In · Living Fountains Farm</title>
<meta name="description" content="Log in to your Living Fountains Farm buyer or seller account.">
<link rel="canonical" href="https://livingfountainsfarm.co.ke/login.html">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="icon" type="image/png" href=''favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="navbar">
    <a href="index.html" class="logo-link">
      <img src="assets/logo.png" alt="Living Fountains Farm logo" style="height:52px;width:auto;display:block;">
    </a>
    <div class="nav-menu-wrap" id="navMenu">
      <ul class="nav-links">
        <li><a href="about.html">About Us</a></li>
        <li><a href="for-buyers.html">For Buyers</a></li>
        <li><a href="for-sellers.html">For Sellers</a></li>
        <li><a href="faqs.html">FAQs</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
      <div class="nav-right">
        <a href="login.html" class="btn btn-ghost btn-small">Log in</a>
        <a href="get-started.html" class="btn btn-primary btn-small">Get Started</a>
      </div>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Toggle menu"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
  </div>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <span class="eyebrow">Welcome back</span>
      <h2 style="margin-bottom:6px;">Log in to your account</h2>
      <p style="color:var(--lf-mist); margin:0;">Choose your account type to continue.</p>
    </div>

    <div class="role-toggle">
      <button class="role-btn active" data-role="buyer" id="loginBuyerTab">As a Buyer</button>
      <button class="role-btn" data-role="seller" id="loginSellerTab">As a Seller</button>
    </div>

    <!-- Buyer login -->
    <form class="auth-panel active" id="loginBuyerPanel">
      <div class="form-group">
        <label>Business Email *</label>
        <input type="email" name="email" placeholder="you@business.co.ke" required>
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in as Buyer</button>
    </form>

    <!-- Seller login -->
    <form class="auth-panel" id="loginSellerPanel">
      <div class="form-group">
        <label>M-PESA Mobile Number *</label>
        <input type="tel" name="mpesa" placeholder="07XX XXX XXX" required>
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in as Seller</button>
    </form>

    <div class="auth-divider">or</div>
    <a href="https://wa.me/254114114131" class="btn btn-outline btn-block" target="_blank" rel="noopener noreferrer"><i class="fab fa-whatsapp"></i> Get help via WhatsApp</a>

    <p class="auth-switch">Don't have an account? <a href="get-started.html">Get started</a></p>
  </div>
</div>

<footer class="footer">
  <div class="container footer-bottom" style="border-top:none; padding-top:30px;">
    <p>© 2026 Living Fountains Farm. All rights reserved.</p>
    <a href="privacy-policy.html">Privacy Policy</a>
  </div>
</footer>

<a href="https://wa.me/254114114131" class="whatsapp-float" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp"><i class="fab fa-whatsapp"></i></a>

<script src="script.js"></script>
<script>
  (function() {
    const buyerTab = document.getElementById('loginBuyerTab');
    const sellerTab = document.getElementById('loginSellerTab');
    const buyerPanel = document.getElementById('loginBuyerPanel');
    const sellerPanel = document.getElementById('loginSellerPanel');
    buyerTab.addEventListener('click', () => {
      buyerTab.classList.add('active'); sellerTab.classList.remove('active');
      buyerPanel.classList.add('active'); sellerPanel.classList.remove('active');
    });
    sellerTab.addEventListener('click', () => {
      sellerTab.classList.add('active'); buyerTab.classList.remove('active');
      sellerPanel.classList.add('active'); buyerPanel.classList.remove('active');
    });
    [buyerPanel, sellerPanel].forEach(form => {
      form.addEventListener('submit', e => {
        e.preventDefault();
        alert('This is a demo login form. Connect it to your authentication backend to go live.');
      });
    });
  })();
</script>
</body>
</html>
